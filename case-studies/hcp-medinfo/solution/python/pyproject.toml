[project]
name = "hcp-medinfo"
version = "0.1.0"
description = "Reference solution: the HCP medical information pipeline, Medical Question Helper"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.21",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary]==3.3.9",
  "pyyaml==6.0.2",
]

[tool.uv]
package = false

# Python steps follow the same readable-code rules as TypeScript. See STANDARD.md, "Readable code".
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM", "C90", "PLR0913", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 30
max-nested-blocks = 3
